<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الرؤية الذكي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .container { max-width: 600px; width: 100%; }
        h1 { text-align: center; font-size: 28px; margin-bottom: 8px; color: #38bdf8; }
        p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; }
        .upload-box { border: 2px dashed #334155; border-radius: 16px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s; background: #1e293b; }
        .upload-box:hover { border-color: #38bdf8; }
        .upload-box input { display: none; }
        .upload-box label { cursor: pointer; font-size: 16px; color: #94a3b8; }
        .upload-box img { max-width: 100%; max-height: 300px; border-radius: 12px; margin-top: 16px; }
        .btn { width: 100%; padding: 14px; background: #0ea5e9; border: none; border-radius: 12px; color: white; font-size: 18px; cursor: pointer; margin-top: 16px; transition: background 0.3s; }
        .btn:hover { background: #0284c7; }
        .btn:disabled { background: #334155; cursor: not-allowed; }
        .btn-speak { background: #7c3aed; margin-top: 12px; }
        .btn-speak:hover { background: #6d28d9; }
        .results { margin-top: 24px; background: #1e293b; border-radius: 16px; padding: 20px; display: none; }
        .results h2 { color: #38bdf8; margin-bottom: 16px; font-size: 20px; }
        .object-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #0f172a; border-radius: 10px; margin-bottom: 8px; }
        .arabic { font-size: 18px; font-weight: bold; color: #38bdf8; }
        .english { font-size: 14px; color: #64748b; }
        .count { text-align: center; color: #94a3b8; margin-top: 12px; font-size: 14px; }
        .loading { text-align: center; color: #38bdf8; margin-top: 16px; display: none; font-size: 16px; }
        .empty { text-align: center; color: #ef4444; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 مساعد الرؤية الذكي</h1>
        <p class="subtitle">ارفع صورة وسيقوم الذكاء الاصطناعي بتحديد الأشياء فيها</p>

        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" accept="image/*" onchange="previewImage(event)">
            <label>📷 اضغط هنا لاختيار صورة</label>
            <img id="preview" style="display:none">
        </div>

        <button class="btn" id="detectBtn" onclick="detect()" disabled>🔍 تحليل الصورة</button>

        <div class="loading" id="loading">⏳ جاري التحليل... قد يستغرق حتى 60 ثانية في أول مرة</div>

        <div class="results" id="results">
            <h2>🎯 الأشياء المكتشفة</h2>
            <div id="objectsList"></div>
            <p class="count" id="countText"></p>
            <button class="btn btn-speak" id="speakBtn" onclick="speak()">🔊 اسمع النتائج بالعربي</button>
        </div>
    </div>

    <script>
        let detectedArabic = [];

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const preview = document.getElementById('preview');
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
                document.querySelector('.upload-box label').style.display = 'none';
                document.getElementById('detectBtn').disabled = false;
            }
        }

        async function detect() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;

            document.getElementById('detectBtn').disabled = true;
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/predict', { method: 'POST', body: formData });
                const data = await response.json();

                detectedArabic = data.detected_arabic || [];
                const list = document.getElementById('objectsList');
                list.innerHTML = '';

                if (data.count === 0) {
                    list.innerHTML = '<div class="empty">❌ لم يتم اكتشاف أي شيء</div>';
                } else {
                    data.detected_arabic.forEach((arabic, i) => {
                        list.innerHTML += `
                            <div class="object-item">
                                <span class="arabic">${arabic}</span>
                                <span class="english">${data.detected_english[i]}</span>
                            </div>`;
                    });
                    setTimeout(() => speak(), 500);
                }

                document.getElementById('countText').textContent = `تم اكتشاف ${data.count} شيء`;
                document.getElementById('results').style.display = 'block';
            } catch (e) {
                alert('حدث خطأ! حاول مرة أخرى');
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('detectBtn').disabled = false;
        }

        function speak() {
            if (detectedArabic.length === 0) return;
            window.speechSynthesis.cancel();
            const text = 'تم اكتشاف: ' + detectedArabic.join('، ');
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
